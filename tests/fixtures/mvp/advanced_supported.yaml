# Public synthetic endpoints; protocol field validation only.
proxies:
  - name: tuic_fixture
    type: tuic
    server: 127.0.0.1
    port: 19877
    uuid: 00000000-0000-4000-8000-000000000001
    password: public_fixture_password
    alpn: [h3]
    congestion-controller: bbr
    udp-relay-mode: native
    sni: proxy.example.invalid
    disable-sni: false
    reduce-rtt: false
    request-timeout: 8000
    heartbeat-interval: 10000
    skip-cert-verify: false
    max-udp-relay-packet-size: 1252
    fast-open: false
    max-open-streams: 100
  - name: tuic_token_fixture
    type: tuic
    server: 127.0.0.1
    port: 19878
    token: public_fixture_token
    alpn: [h3]
    congestion-controller: cubic
    udp-relay-mode: quic
    udp: true
proxy-groups:
  - name: Balanced
    type: load-balance
    proxies: [tuic_fixture, DIRECT]
    strategy: consistent-hashing
    url: https://example.invalid/generate_204
    interval: 3600
    lazy: true
  - name: RoundRobin
    type: load-balance
    proxies: [DIRECT, tuic_token_fixture]
    strategy: round-robin
    url: https://example.invalid/generate_204
    interval: 3600
    lazy: true
  - name: StickySessions
    type: load-balance
    proxies: [DIRECT, tuic_fixture]
    strategy: sticky-sessions
    url: https://example.invalid/generate_204
    interval: 3600
    lazy: true
rules: ['MATCH,DIRECT']
dns:
  enable: true
  enhanced-mode: redir-host
  nameserver: [https://1.1.1.1/dns-query]
  default-nameserver: [1.1.1.1]
  proxy-server-nameserver: [https://1.1.1.1/dns-query]
  nameserver-policy: {'+.example.invalid': [https://8.8.8.8/dns-query]}
  direct-nameserver: [https://1.1.1.1/dns-query]
  direct-nameserver-follow-policy: false
  cache-algorithm: arc
