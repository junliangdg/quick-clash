name: windows_validation
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag or commit to test (empty uses the selected workflow ref)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: windows-validation-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Repository checks and script tests
        shell: pwsh
        run: |
          . ./scripts/native_process.ps1
          $shell = (Get-Process -Id $PID).Path
          $checks = @(
            @{ path = 'scripts/build_design_docs.ps1'; arguments = @('-Check') }
            @{ path = 'scripts/check_source_layout.ps1' }
            @{ path = 'scripts/check_ui_glyphs.ps1' }
            @{ path = 'scripts/check_platform_boundaries.ps1' }
            @{ path = 'scripts/check_progress.ps1' }
            @{ path = 'tests/scripts/check_progress_test.ps1' }
            @{ path = 'tests/scripts/select_ci_scope_test.ps1' }
            @{ path = 'tests/scripts/select_windows_tests_test.ps1' }
            @{ path = 'tests/scripts/native_process_test.ps1' }
            @{ path = 'tests/scripts/fetch_dependencies_test.ps1' }
            @{ path = 'tests/scripts/generate_release_notes_test.ps1' }
            @{ path = 'tests/scripts/publish_release_test.ps1' }
            @{ path = 'tests/scripts/package_readmes_test.ps1' }
            @{ path = 'tests/scripts/service_package_test.ps1' }
            @{ path = 'tests/scripts/attach_memory_test.ps1' }
          )
          foreach ($check in $checks) {
            $name = [IO.Path]::GetFileNameWithoutExtension($check.path)
            # Keep native Git text UTF-8 inside each redirected child shell.
            $command = "`$ErrorActionPreference = 'Stop'; [Console]::OutputEncoding = [Text.UTF8Encoding]::new(); & './$($check.path)'"
            $arguments = @('-NoProfile', '-Command', $command)
            if ($check.arguments) { $arguments += $check.arguments }
            Invoke-NativeStep -Executable $shell -Arguments $arguments -WorkingDirectory $PWD.Path -LogPath "build/script_tests/repository_logs/$name.log" -TimeoutSeconds 120
          }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Pinned build tools
        run: |
          python -m pip install --only-binary=:all: cmake==4.3.0 ninja==1.13.2
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          arch: win64_msvc2022_64
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'
          py7zrversion: '==1.1.0'
      - name: Cache pinned dependency assets
        uses: actions/cache@v5
        with:
          path: |
            .cache/yaml_cpp_*.tar.gz
            .cache/mihomo-windows-*.zip
            .cache/mihomo/license.txt
            .cache/geo/
          key: windows-assets-${{ hashFiles('docs/baseline/release_matrix.json') }}
      - name: Acquire and reverify runtime dependencies
        shell: pwsh
        run: ./scripts/fetch_dependencies.ps1
      - name: Full Windows build, QML checks and tests
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1 -Full -BuildTimeoutSeconds 1200 -TestTimeoutSeconds 1200
          ./tests/scripts/select_windows_tests_test.ps1 -ConfiguredManifest build/dev/quickclash_tests.json
      - name: Full headless build and tests
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1 -Headless -Full -BuildTimeoutSeconds 1200 -TestTimeoutSeconds 1200
          ./tests/scripts/select_windows_tests_test.ps1 -ConfiguredManifest build/headless/quickclash_tests.json
      - name: Official core API, listener ownership and Job probes
        shell: pwsh
        run: ./scripts/probe_mihomo.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows_validation_logs
          retention-days: 14
          path: |
            build/script_tests/
            build/dev/logs/
            build/dev/quickclash_tests.json
            build/dev/Testing/Temporary/
            build/dev/CMakeFiles/CMakeConfigureLog.yaml
            build/headless/logs/
            build/headless/quickclash_tests.json
            build/headless/Testing/Temporary/
            build/headless/CMakeFiles/CMakeConfigureLog.yaml
            build/core_probe/
            aqtinstall.log
