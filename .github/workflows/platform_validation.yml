name: platform_validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux_gcc_64
          - os: macos-15
            arch: clang_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Pinned build tools
        run: |
          python -m pip install --only-binary=:all: cmake==4.3.0 ninja==1.13.2
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          arch: ${{ matrix.arch }}
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'
          py7zrversion: '==1.1.0'
      - name: Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libegl1 libopengl0 fonts-noto-cjk
      - uses: actions/cache@v5
        with:
          path: .cache/yaml_cpp_*.tar.gz
          key: ${{ runner.os }}-yaml-${{ hashFiles('docs/baseline/release_matrix.json') }}
      - name: Acquire verified YAML archive
        shell: pwsh
        run: ./scripts/fetch_dependencies.ps1 -YamlOnly
      - name: Native build and QML checks
        shell: bash
        run: |
          mkdir -p build/dev/logs
          cmake --preset dev 2>&1 | tee build/dev/logs/configure.log
          cmake --build --preset dev --parallel 3 2>&1 | tee build/dev/logs/build.log
          cmake --build build/dev --target quickclash_qmllint 2>&1 | tee build/dev/logs/qmllint.log
      - name: Verify native test selection
        shell: pwsh
        run: ./tests/scripts/select_windows_tests_test.ps1 -ConfiguredManifest build/dev/quickclash_tests.json
      - name: Native tests
        # Windows-specific core/lease tests are registered only on Windows by CMake.
        # Unsupported adapters and shared unit/UI contracts still run here.
        # The dev preset runs full UI variants in place of shorter duplicate entries.
        shell: bash
        run: ctest --preset dev --no-tests=error --timeout 60 --output-junit build/dev/native_tests.xml 2>&1 | tee build/dev/logs/ctest.log
      - name: Headless boundary
        shell: bash
        run: |
          mkdir -p build/headless/logs
          cmake --preset headless 2>&1 | tee build/headless/logs/configure.log
          cmake --build --preset headless --parallel 3 2>&1 | tee build/headless/logs/build.log
          ctest --preset headless --no-tests=error --timeout 60 --output-junit build/headless/headless_tests.xml 2>&1 | tee build/headless/logs/ctest.log
      - name: Verify headless test selection
        shell: pwsh
        run: ./tests/scripts/select_windows_tests_test.ps1 -ConfiguredManifest build/headless/quickclash_tests.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: platform_logs_${{ matrix.os }}
          retention-days: 14
          path: |
            build/dev/logs/
            build/dev/quickclash_tests.json
            build/dev/Testing/Temporary/
            build/dev/CMakeFiles/CMakeConfigureLog.yaml
            build/headless/logs/
            build/headless/quickclash_tests.json
            build/headless/Testing/Temporary/
            build/headless/CMakeFiles/CMakeConfigureLog.yaml
            build/dev/native_tests.xml
            build/headless/headless_tests.xml
            build/script_tests/
            aqtinstall.log
