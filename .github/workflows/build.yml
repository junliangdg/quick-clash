name: build_and_release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: windows-2022
    timeout-minutes: 10
    concurrency:
      group: windows-scope-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    outputs:
      product: ${{ steps.scope.outputs.product }}
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select build and publication scope
        id: scope
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./scripts/select_ci_scope.ps1 `
            -EventName $env:GITHUB_EVENT_NAME -Ref $env:GITHUB_REF `
            -DefaultBranch $env:DEFAULT_BRANCH -BeforeSha $env:BEFORE_SHA `
            -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA `
            -OutputPath $env:GITHUB_OUTPUT
  windows:
    needs: scope
    if: needs.scope.outputs.product == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: windows-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Pinned build tools
        run: |
          python -m pip install --only-binary=:all: cmake==4.3.0 ninja==1.13.2
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          arch: win64_msvc2022_64
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'
          py7zrversion: '==1.1.0'
      - name: Cache pinned dependency assets
        uses: actions/cache@v5
        with:
          path: |
            .cache/yaml_cpp_*.tar.gz
            .cache/mihomo-windows-*.zip
            .cache/mihomo/license.txt
            .cache/geo/
          key: windows-assets-${{ hashFiles('docs/baseline/release_matrix.json') }}
      - name: Acquire and reverify runtime dependencies
        shell: pwsh
        run: ./scripts/fetch_dependencies.ps1
      - name: Build production Release and package Windows runtime
        shell: pwsh
        env:
          PUBLISH_PACKAGE: ${{ needs.scope.outputs.publish }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          # Both continuous and version tags build with BUILD_TESTING=OFF.
          ./scripts/build_windows.ps1 -Release -BuildTimeoutSeconds 1200
          if ($env:PUBLISH_PACKAGE -eq 'true') {
            $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:RELEASE_REF } else { 'continuous' }
            ./scripts/package_release_windows.ps1 -BuildDirectory build/release -Version $version -Commit $env:GITHUB_SHA
          }
      - uses: actions/upload-artifact@v6
        if: needs.scope.outputs.publish == 'true'
        with:
          name: windows_package
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/quickclash_windows_x64.zip
            dist/quickclash_windows_x64.zip.sha256
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows_logs
          retention-days: 14
          path: |
            build/release/logs/
            build/release/CMakeFiles/CMakeConfigureLog.yaml
            aqtinstall.log
  release_windows:
    needs: [scope, windows]
    if: needs.scope.outputs.publish == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: windows_package
          path: dist
      - name: Publish verified package without rebuilding
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
        run: ./scripts/publish_release.ps1 -Repository $env:GH_REPO -Commit $env:GITHUB_SHA -RefName $env:RELEASE_REF -RefType $env:GITHUB_REF_TYPE
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release_windows_logs
          retention-days: 14
          path: build/release/logs/
